<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page Not Found | REM Realty</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
        background-color: #0f172a;
        color: #f8fafc;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 24px;
        text-align: center;
      }
      .card {
        max-width: 480px;
        width: 100%;
        background-color: #1e293b;
        border: 1px solid #334155;
        border-radius: 20px;
        padding: 40px 32px;
        box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
      }
      .logo {
        width: 48px;
        height: 48px;
        background-color: #2563eb;
        color: white;
        font-weight: 800;
        font-size: 16px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 12px;
        margin-bottom: 20px;
        letter-spacing: -0.5px;
      }
      .code {
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 1.5px;
        color: #38bdf8;
        margin-bottom: 8px;
      }
      h1 {
        font-size: 24px;
        font-weight: 800;
        letter-spacing: -0.5px;
        margin-bottom: 12px;
        color: white;
      }
      p {
        font-size: 13px;
        color: #94a3b8;
        line-height: 1.6;
        margin-bottom: 28px;
      }
      .btn {
        display: inline-block;
        width: 100%;
        padding: 12px 24px;
        background-color: #2563eb;
        color: white;
        text-decoration: none;
        font-weight: 700;
        font-size: 13px;
        border-radius: 10px;
        transition: background-color 0.2s;
      }
      .btn:hover { background-color: #1d4ed8; }
      .links {
        margin-top: 24px;
        display: flex;
        justify-content: center;
        gap: 16px;
        font-size: 12px;
      }
      .links a {
        color: #64748b;
        text-decoration: none;
      }
      .links a:hover { color: #cbd5e1; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="logo">REM</div>
      <div class="code">404 Error</div>
      <h1>Property Not Located</h1>
      <p>The page or listing you are looking for has been moved, archived, or is no longer accessible on the Bengaluru portal.</p>
      <a href="./" class="btn">Return to Verified Properties</a>
      <div class="links">
        <a href="./?type=sale">For Sale</a>
        <span>•</span>
        <a href="./?type=rent">For Rent</a>
        <span>•</span>
        <a href="./?tab=invest">Co-Ownership</a>
      </div>
    </div>
  </body>
</html>
